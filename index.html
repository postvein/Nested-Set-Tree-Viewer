<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nested Set Tree Viewer</title>

  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="tree.js" defer></script>
</head>

<body>
  <header>
    <div class="title-wrap">
      <h1>Nested Set Tree Viewer</h1>

      <div class="subtitle">
        Nested sets model visualization
      </div>
    </div>

    <div class="toolbar">
      <button id="fitBtn" type="button">
        Fit
      </button>

      <button id="layoutBtn" type="button">
        Reset layout
      </button>

      <button id="extensionsBtn" type="button">
        Add extensions
      </button>

      <button id="openFileBtn" type="button">
        Open JSON file
      </button>

      <button
        id="openModalBtn"
        class="primary"
        type="button"
      >
        Paste JSON
      </button>

      <input
        id="fileInput"
        type="file"
        accept=".json,application/json"
        hidden
      />
    </div>
  </header>

  <main id="treeContainer">
    <svg id="treeSvg">
      <defs>
        <marker
          id="arrowhead"
          markerWidth="8"
          markerHeight="8"
          refX="7"
          refY="4"
          orient="auto"
          markerUnits="strokeWidth"
        >
          <path d="M 0 0 L 8 4 L 0 8 z"></path>
        </marker>
      </defs>

      <g id="treeViewport"></g>
    </svg>
  </main>

  <div id="emptyState" class="empty-state">
    <div class="empty-card">
      <strong>No tree loaded</strong>

      Click <b>Paste JSON</b> or
      <b>Open JSON file</b> to load a tree.
    </div>
  </div>

  <div id="stats" class="stats"></div>

  <div
    id="modalBackdrop"
    class="modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">
          Paste JSON data
        </h2>

        <p id="modalDescription">
          Paste tree JSON.
        </p>
      </div>

      <div class="modal-body">
        <textarea
          id="jsonInput"
          spellcheck="false"
        ></textarea>

        <div
          id="errorBox"
          class="error"
        ></div>
      </div>

      <div class="modal-footer">
        <button
          id="cancelBtn"
          type="button"
        >
          Cancel
        </button>

        <button
          id="buildBtn"
          class="primary"
          type="button"
        >
          Build tree
        </button>
      </div>
    </div>
  </div>
</body>
</html>
